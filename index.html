                        { time: "19:15-20:30", title: "Mini Chef 餐廳晚餐", desc: "Lego House 內的機器人送餐餐廳 Mini Chef (19:15 已預約)", map: "MINI CHEF Lego House", tags: ["已預約"] },
                        { time: "20:30", title: "返回飯店", desc: "搭乘 43 號公車返回機場飯店", map: "Airport Hotel Billund" }
                    ]
                },
                {
                    day: 15, date: "8/13 (四)", city: "比隆 ➔ 哥本哈根", hotel: "Andersen Boutique Hotel",
                    events: [
                        { time: "10:00-16:30", title: "比隆樂高樂園 Legoland", desc: "Legoland Billund 全日遊 (已訂票)，午餐於園區 Burger Kitchen 享用", map: "Legoland Billund", tags: ["已訂票"] },
                        { time: "16:30-17:00", title: "返回拿行李", desc: "離開樂園回機場飯店取行李", map: "Airport Hotel Billund" },
                        { time: "17:25-20:32", title: "長途返回哥本哈根", desc: "17:25 搭 43 公車 ➔ 17:53 Vejle ➔ 18:06 搭 ICL 50058 火車 ➔ 20:32 抵達 CPH", map: "Copenhagen Central Station", tags: ["交通"] },
                        { time: "20:30-21:30", title: "Check-in & 晚餐", desc: "Andersen Boutique Hotel 入住，市區速食店或超市晚餐", map: "Andersen Boutique Hotel" }
                    ]
                },
                {
                    day: 16, date: "8/14 (五) & 8/15 (六)", city: "哥本哈根 ➔ 溫馨的家", hotel: "機上 / 返家",
                    events: [
                        { time: "09:00-11:00", title: "退房與退稅準備", desc: "Hotel Check-out，準備行李與退稅單據", map: "Andersen Boutique Hotel" },
                        { time: "11:00-13:00", title: "市區最後巡禮", desc: "哥本哈根市政廳 (與安徒生銅像拍照)、皇家圖書館 (黑鑽石)", map: "Copenhagen City Hall", tags: ["必去"] },
                        { time: "13:00-14:00", title: "午餐 & 前往海博館", desc: "館內餐廳或前晚超市預買，搭車前往國立海洋博物館", map: "National Aquarium Denmark" },
                        { time: "14:00-16:00", title: "國立海洋博物館", desc: "Den Blå Planet (14:00-15:00 入場，已訂票)", map: "National Aquarium Denmark", tags: ["已訂票"] },
                        { time: "16:00-17:15", title: "前往機場 T2", desc: "從海博館步行約 23 分鐘或搭車至哥本哈根機場 T2 (17:15 前抵達)", map: "Copenhagen Airport" },
                        { time: "19:15", title: "班機起飛返台", desc: "19:15 班機起飛 ➔ 8/15 (六) 17:55 順利抵達台灣 TPE！", map: "" }
                    ]
                }
            ],
            packingList: {
                "證件/金融類": ["護照", "信用卡 (刷卡為主)", "外幣 (歐元/丹麥克朗)", "SIM卡"],
                "服裝類 (18-25°C)": ["短袖 T-Shirt", "短褲 / 長褲", "輕羽絨 / 防風外套 (丹麥稍涼)", "內衣褲 / 襪子 ", "拖鞋", "帽子 / 墨鏡"],
                "電子產品": ["手機", "耳機", "充電器 / 充電線", "萬國轉接頭", "行動電源 (不可托運)", ],
                "生活用品": ["洗面乳 / 保養品 / 防曬品", "牙刷 / 牙膏", "止瀉藥 / 常備藥", "衛生紙 / 濕紙巾", "刮鬍刀 / 髮品", "指甲刀 (必須托運)"]
            }
        };

        let currentDay = 1;

        function initApp() {
            renderTabs();
            renderItinerary(currentDay);
        }

        function renderTabs() {
            const tabsContainer = document.getElementById('dayTabs');
            tabsContainer.innerHTML = tripData.days.map(d => `
                <button onclick="changeDay(${d.day})" id="tab-${d.day}" 
                    class="px-4 py-2.5 whitespace-nowrap text-center border-b-2 ${d.day === currentDay ? 'border-blue-500 text-blue-400 font-bold bg-slate-700' : 'border-transparent text-gray-300 hover:bg-slate-700'} transition">
                    <div class="text-xs opacity-75">Day ${d.day}</div>
                    <div class="font-semibold">${d.date.split(' ')[0]}</div>
                </button>
            `).join('');
        }

        function changeDay(dayNum) {
            currentDay = dayNum;
            renderTabs();
            renderItinerary(dayNum);
            // Scroll active tab to center
            const activeTab = document.getElementById(`tab-${dayNum}`);
            if (activeTab) activeTab.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }

        function renderItinerary(dayNum) {
            const dayData = tripData.days.find(d => d.day === dayNum);
            const mainContent = document.getElementById('mainContent');

            let html = `
                <!-- Day Header Card -->
                <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-200 mb-4 flex justify-between items-center">
                    <div>
                        <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">DAY ${dayData.day}</span>
                        <h2 class="text-lg font-bold text-gray-800 mt-1">${dayData.date} - ${dayData.city}</h2>
                        <p class="text-xs text-gray-500 mt-0.5"><i class="fa-solid fa-bed text-blue-500 mr-1"></i>${dayData.hotel}</p>
                    </div>
                </div>

                <!-- Timeline Items -->
                <div class="space-y-3">
            `;

            dayData.events.forEach(item => {
                let tagMarkup = '';
                if (item.tags) {
                    item.tags.forEach(t => {
                        let cls = 'bg-gray-100 text-gray-700';
                        if (t.includes('必去')) cls = 'tag-mustsee';
                        else if (t.includes('交通') || t.includes('機票')) cls = 'tag-transport';
                        else if (t.includes('美食') || t.includes('晚餐')) cls = 'tag-food';
                        else if (t.includes('訂票') || t.includes('預約')) cls = 'tag-ticket';
                        tagMarkup += `<span class="text-[10px] font-bold px-2 py-0.5 rounded mr-1 ${cls}">${t}</span>`;
                    });
                }

                const mapBtn = item.map ? `
                    <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.map)}" target="_blank" 
                       class="mt-2 inline-flex items-center text-xs text-blue-600 font-semibold hover:underline">
                        <i class="fa-solid fa-location-dot mr-1 text-red-500"></i> Google 地圖導航
                    </a>
                ` : '';

                html += `
                    <div class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 flex gap-3">
                        <div class="text-xs font-bold text-blue-600 w-20 flex-shrink-0 pt-0.5">
                            ${item.time}
                        </div>
                        <div class="flex-grow">
                            <div class="flex items-center flex-wrap gap-1 mb-1">
                                <h3 class="font-bold text-gray-800 text-sm">${item.title}</h3>
                                ${tagMarkup}
                            </div>
                            <p class="text-xs text-gray-600 whitespace-pre-line leading-relaxed">${item.desc}</p>
                            ${mapBtn}
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            mainContent.innerHTML = html;
        }

        function switchView(viewName) {
            const mainContent = document.getElementById('mainContent');
            const dayTabs = document.getElementById('dayTabs');

            // Reset Nav Styles
            ['itinerary', 'hotels', 'info', 'packing'].forEach(v => {
                const btn = document.getElementById(`nav-${v}`);
                if (v === viewName) {
                    btn.className = "flex flex-col items-center text-blue-600 font-bold";
                } else {
                    btn.className = "flex flex-col items-center text-gray-500";
                }
            });

            if (viewName === 'itinerary') {
                dayTabs.style.display = 'flex';
                renderItinerary(currentDay);
            } else {
                dayTabs.style.display = 'none';

                if (viewName === 'hotels') {
                    mainContent.innerHTML = `
                        <h2 class="text-lg font-bold text-gray-800 mb-3"><i class="fa-solid fa-hotel text-blue-600 mr-2"></i>飯店住宿總覽</h2>
                        <div class="space-y-3">
                            ${tripData.hotels.map(h => `
                                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                    <div class="flex justify-between items-start">
                                        <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded">${h.date}</span>
                                    </div>
                                    <h3 class="font-bold text-gray-800 text-sm mt-2">${h.name}</h3>
                                    <p class="text-xs text-gray-500">${h.enName}</p>
                                    <p class="text-xs text-gray-600 mt-1"><i class="fa-solid fa-location-dot text-gray-400 mr-1"></i>${h.address}</p>
                                    <a href="${h.map}" target="_blank" class="mt-2 inline-block text-xs text-blue-600 font-semibold hover:underline">
                                        <i class="fa-solid fa-map-location-dot mr-1"></i> 打開 Google 地圖
                                    </a>
                                </div>
                            `).join('')}
                        </div>
                    `;
                } else if (viewName === 'info') {
                    mainContent.innerHTML = `
                        <h2 class="text-lg font-bold text-gray-800 mb-3"><i class="fa-solid fa-circle-info text-blue-600 mr-2"></i>交通與旅遊實用資訊</h2>
                        
                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3">
                            <h3 class="font-bold text-gray-800 text-sm mb-2 text-blue-600"><i class="fa-solid fa-train mr-1"></i>柏林大眾交通 (S-Bahn / U-Bahn)</h3>
                            <ul class="text-xs text-gray-600 space-y-1 list-disc pl-4">
                                <li>AB區：一般票 4.00€ / 短票 2.80€ / 4張單程票 12.00€ / 一日票 11.20€</li>
                                <li>ABC區：一般票 5.00€ / 4張單程票 16.80€ / 一日票 12.60€</li>
                                <li><strong>短票規則：</strong>可搭地鐵/快鐵 3 站或公車 6 站，不可轉車/出站。</li>
                                <li><strong>一般票規則：</strong>搭乘後 120 分鐘內同方向搭到飽，不可走回頭路。</li>
                            </ul>
                        </div>

                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3">
                            <h3 class="font-bold text-gray-800 text-sm mb-2 text-blue-600"><i class="fa-solid fa-coins mr-1"></i>丹麥貨幣與退稅</h3>
                            <ul class="text-xs text-gray-600 space-y-1 list-disc pl-4">
                                <li>貨幣：丹麥克朗 (DKK)，1 DKK ≈ 4.5 TWD。</li>
                                <li>建議帶歐元至當地兌換，或是全程信用卡支付（丹麥刷卡極度普及）。</li>
                                <li><strong>退稅：</strong>單一店家消費滿 300 DKK 即可申請退稅，退稅比例約 13% ~ 19%。</li>
                            </ul>
                        </div>

                        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                            <h3 class="font-bold text-gray-800 text-sm mb-2 text-blue-600"><i class="fa-solid fa-cloud-sun mr-1"></i>氣候與穿搭建議</h3>
                            <p class="text-xs text-gray-600 leading-relaxed">
                                柏林夏天約 15–25°C，穿著短袖並準備防曬與薄外套；丹麥夏天平均約 18°C，早晚偏涼，<strong>務必攜帶輕羽絨外套與防風外套</strong>。
                            </p>
                        </div>
                    `;
                } else if (viewName === 'packing') {
                    let packingHtml = `<h2 class="text-lg font-bold text-gray-800 mb-3"><i class="fa-solid fa-suitcase text-blue-600 mr-2"></i>行李打包清單</h2>`;
                    
                    for (const [category, items] of Object.entries(tripData.packingList)) {
                        packingHtml += `
                            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 mb-3">
                                <h3 class="font-bold text-gray-800 text-sm mb-2 border-b pb-1 text-blue-600">${category}</h3>
                                <div class="grid grid-cols-2 gap-2">
                                    ${items.map(item => `
                                        <label class="flex items-center text-xs text-gray-700 cursor-pointer">
                                            <input type="checkbox" class="rounded border-gray-300 text-blue-600 mr-2 h-4 w-4">
                                            <span>${item}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    }
                    mainContent.innerHTML = packingHtml;
                }
            }
        }

        // Initialize App on load
        window.onload = initApp;
    </script>
</body>
</html>
